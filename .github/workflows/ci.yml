name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: pip install -e ".[test]"
      - name: Run tests
        run: pytest -q
      - name: Generate demo dataset
        run: python scripts/generate_dataset.py --rows 1200 --output /tmp/network_events.csv
      - name: Smoke test training
        run: python scripts/train.py --input /tmp/network_events.csv --model-dir /tmp/tarang-models
