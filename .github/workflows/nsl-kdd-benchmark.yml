name: NSL-KDD Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Download and verify NSL-KDD
        run: python scripts/download_nsl_kdd.py

      - name: Run untouched-test benchmark
        run: python scripts/benchmark_nsl_kdd.py

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: tarang-nsl-kdd-benchmark
          path: artifacts/nsl-kdd/
